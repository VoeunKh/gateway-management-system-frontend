openapi: 3.0.3
info:
  title: gwfleet backend API
  description: >
    Backend for managing OpenWrt LTE gateways: inventory, metrics, jobs,
    UCI config push, firmware rollouts, alerts.
  version: "1.0.0"
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: health
  - name: auth
  - name: users
  - name: models
  - name: sites
  - name: devices
  - name: configs
  - name: packages
  - name: overview
  - name: download

paths:
  /healthz:
    get:
      tags: [health]
      summary: Health check
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required: [status]

  /auth/login:
    post:
      tags: [auth]
      summary: Log in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded
          headers:
            Set-Cookie:
              description: HttpOnly refresh token cookie, scoped to /api/v1/auth
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid credentials or account locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalid_credentials:
                  value:
                    error:
                      code: invalid_credentials
                      message: invalid email or password
                account_locked:
                  value:
                    error:
                      code: account_locked
                      message: account is temporarily locked

  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the refresh token cookie for a new access token
      security: []
      parameters:
        - name: gwf_refresh
          in: cookie
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Refresh succeeded
          headers:
            Set-Cookie:
              description: Rotated HttpOnly refresh token cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current refresh token
      parameters:
        - name: gwf_refresh
          in: cookie
          schema:
            type: string
      responses:
        "204":
          description: Logged out (idempotent, always succeeds)
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      tags: [auth]
      summary: Get the current authenticated user
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /users:
    get:
      tags: [users]
      summary: List every user
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [users]
      summary: Get a user by id
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [users]
      summary: Update a user's role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      tags: [users]
      summary: Delete a user
      responses:
        "204":
          description: User deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /models:
    get:
      tags: [models]
      summary: List every gateway model
      responses:
        "200":
          description: List of models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Model"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [models]
      summary: Create a model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateModelRequest"
      responses:
        "201":
          description: Model created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /models/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      tags: [models]
      summary: Update a model's name and hardware facts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateModelRequest"
      responses:
        "200":
          description: Updated model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /sites:
    get:
      tags: [sites]
      summary: List every site
      responses:
        "200":
          description: List of sites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Site"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [sites]
      summary: Create a site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteRequest"
      responses:
        "201":
          description: Site created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /sites/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [sites]
      summary: Update a site's name and vars
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteRequest"
      responses:
        "200":
          description: Updated site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /models/{id}/configs:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [configs]
      summary: List config versions for a model, newest first
      responses:
        "200":
          description: List of config versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConfigVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [configs]
      summary: Save a new config version (version = last + 1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConfigVersionRequest"
      responses:
        "201":
          description: Config version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigVersion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Text is identical to the latest version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            Invalid UCI text (code config_invalid, details.line names the
            offending line) or missing note (code validation_failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /models/{id}/configs/{v}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: v
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [configs]
      summary: Get a single config version
      responses:
        "200":
          description: The config version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /models/{id}/configs/{v}/diff:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: v
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [configs]
      summary: Line diff of version v against another version
      parameters:
        - name: against
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Line-by-line diff
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiffOp"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /models/{id}/packages:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [packages]
      summary: Fleet package view of a model
      description: >
        Every package the model's gateways report (their model's report
        list), which versions run on how many gateways, and what each
        firmware release those gateways run expects (BE-08.2). Packages a
        manifest lists but no gateway reports are left out.
      responses:
        "200":
          description: The fleet package view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FleetPackages"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /models/{id}/firmware/{version}/manifest:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        description: The firmware version gateways report (DISTRIB_RELEASE)
        schema:
          type: string
    get:
      tags: [packages]
      summary: Package list recorded for a firmware release
      responses:
        "200":
          description: The manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmwareManifest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [packages]
      summary: Record the package list of a firmware release
      description: >
        The body is the image's OpenWrt .manifest as the build wrote it,
        one "<name> - <version>" per line (max 1 MiB). Recorded once per
        release: firmware releases are immutable, so a changed image is a
        new version (docs/contracts.md).
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
            example: |
              base-files - 1711~f5dae5ece4
              gw-agent - 0.1.0-r1
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmwareManifestCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /devices:
    get:
      tags: [devices]
      summary: List, search and filter the fleet
      description: >
        Devices ordered by SN, paged with a cursor: pass the next_cursor
        of one page as the cursor of the next. Health and drift are
        computed from live state, never stored.
      parameters:
        - name: model
          in: query
          description: Model id
          schema:
            type: string
        - name: site
          in: query
          description: Site id
          schema:
            type: string
            format: uuid
        - name: health
          in: query
          schema:
            $ref: "#/components/schemas/Health"
        - name: drift
          in: query
          description: Only devices that have drifted, or only those in sync
          schema:
            type: boolean
        - name: package_drift
          in: query
          description: >
            Only devices whose reported packages differ from their
            firmware's manifest (true), or only those that do not (false);
            unknown counts as not drifted
          schema:
            type: boolean
        - name: q
          in: query
          description: >
            SN prefix, site name, or an interface identifier (MAC, IMEI,
            ICCID) substring
          schema:
            type: string
        - name: cursor
          in: query
          description: SN of the last device of the previous page
          schema:
            type: string
        - name: limit
          in: query
          description: Page size, default 50, maximum 200
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: One page of devices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: >
            A filter value is malformed (code validation_failed), e.g. an
            unknown health, a non-uuid site or a limit below 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /devices/{sn}:
    parameters:
      - name: sn
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [devices]
      summary: One device, with its interfaces, metrics and config state
      responses:
        "200":
          description: The device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [devices]
      summary: Set a device's site and lifecycle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevicePatch"
      responses:
        "200":
          description: The updated device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >
            Nothing to update, an unknown lifecycle, or a site that does
            not exist (code validation_failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /devices/{sn}/config/rendered:
    parameters:
      - name: sn
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [configs]
      summary: >
        The device's model's latest config version rendered for display:
        device and site variables substituted, secret values masked as
        "******".
      responses:
        "200":
          description: Rendered config text and its hash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderedConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >
            Rendered config references variables with no value (code
            config_incomplete, details.missing lists every missing
            "namespace.key" name)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /overview:
    get:
      tags: [overview]
      summary: Fleet summary for the console's landing screen
      description: >
        Health is computed from each device's newest telemetry sample by the
        same rule the device list filters on, so these counts always agree
        with GET /devices?health=. active_rollouts and open_alerts are real
        counts and read 0 until the rollout and alert modules land.
      responses:
        "200":
          description: The fleet summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /devices/{sn}/metrics:
    parameters:
      - name: sn
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [devices]
      summary: One device's telemetry series, bucketed for a chart
      description: >
        Buckets are epoch-aligned, so the same step gives the same bucket
        boundaries on every request. A bucket appears only when the device
        reported samples in it, and signal_dbm is null for a bucket in which
        none of them reported one. The series is capped at 2,000 points: a
        range and step that would exceed the cap is served at a coarser step,
        and the step actually used comes back in the response.
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
          description: Start of the range, RFC 3339. Defaults to 24 h before to.
        - name: to
          in: query
          schema:
            type: string
            format: date-time
          description: End of the range, RFC 3339. Defaults to now.
        - name: step
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 86400
          description: Bucket size in seconds. Defaults to 60.
      responses:
        "200":
          description: The telemetry series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsSeries"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >
            from or to is not RFC 3339, from is not before to, the range
            exceeds 30 days, or step is outside 1..86400 (code
            validation_failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /devices/{sn}/history:
    parameters:
      - name: sn
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [devices]
      summary: One device's events and jobs, newest first
      description: >
        device_events and jobs merged into one feed, ordered by creation time.
        Paging is a cursor: pass the next_cursor of the previous page back as
        cursor.
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
          description: next_cursor of the previous page
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
          description: Page size, default 50, maximum 200
      responses:
        "200":
          description: One page of the feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceHistory"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >
            cursor is not one this API handed out, or limit is not a positive
            integer (code validation_failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /dl/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: >
          Self-contained signed link: it carries the bucket, the object key,
          the HTTP method it authorises, and an expiry, all covered by an
          HMAC-SHA256 signature. It is short by design, because the gateway's
          protobuf caps this URL at 256 bytes and a SigV4 presigned S3 URL
          cannot fit in that budget.
        schema:
          type: string
          maxLength: 255
    get:
      tags: [download]
      summary: Download a stored object through a short-lived signed link
      description: >
        Self-authenticating: no Authorization header is read or required.
        The api streams the object from the internal object store, which
        gateways cannot reach directly. A link bound to PUT is rejected
        here even when its signature is valid.
      security: []
      responses:
        "200":
          description: The object
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          description: >
            The link is forged, expired, or bound to another HTTP method.
            Every one of those cases answers identically, so the response
            cannot be used to probe which part of a guess was right.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [download]
      summary: Upload a gateway log archive through a short-lived signed link
      description: >
        Self-authenticating and restricted to the logs bucket, so a link can
        never overwrite a firmware image. Content-Length is required: the api
        streams the body straight to the object store and never buffers it.
      security: []
      requestBody:
        required: true
        content:
          application/gzip:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Stored
        "403":
          description: >
            The link is forged, expired, bound to another method, or points
            at a bucket devices are not allowed to write.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "411":
          description: Content-Length is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The archive is larger than the upload limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              nullable: true
          required: [code, message]
      required: [error]

    CursorPage:
      type: object
      properties:
        next_cursor:
          type: string
          nullable: true
      required: [next_cursor]

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [viewer, release, admin]
      required: [id, email, name, role]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required: [access_token, user]

    CreateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [viewer, release, admin]
      required: [email, name, password, role]

    UpdateUserRequest:
      type: object
      properties:
        role:
          type: string
          enum: [viewer, release, admin]
      required: [role]

    Model:
      type: object
      properties:
        id:
          type: string
          pattern: "^[A-Z0-9-]{2,31}$"
        name:
          type: string
        soc:
          type: string
          nullable: true
          description: >
            SoC the model's gateways run; null when the hardware has not
            been recorded
        ram_mb:
          type: integer
          nullable: true
          description: >
            RAM in the model's gateways, in MB; null when the hardware has
            not been recorded
        flash_mb:
          type: integer
          nullable: true
          description: >
            Flash in the model's gateways, in MB; null when the hardware
            has not been recorded
      required: [id, name]

    CreateModelRequest:
      type: object
      properties:
        id:
          type: string
          pattern: "^[A-Z0-9-]{2,31}$"
        name:
          type: string
        soc:
          type: string
          nullable: true
          description: SoC of the model's gateways; optional
        ram_mb:
          type: integer
          nullable: true
          description: RAM in the model's gateways, in MB; optional
        flash_mb:
          type: integer
          nullable: true
          description: Flash in the model's gateways, in MB; optional
      required: [id, name]

    UpdateModelRequest:
      type: object
      properties:
        name:
          type: string
        soc:
          type: string
          nullable: true
          description: New SoC; omit to leave the recorded one alone
        ram_mb:
          type: integer
          nullable: true
          description: New RAM in MB; omit to leave the recorded one alone
        flash_mb:
          type: integer
          nullable: true
          description: New flash in MB; omit to leave the recorded one alone
      required: [name]

    Site:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        vars:
          type: object
          additionalProperties:
            type: string
          description: Flat object of string values
      required: [id, name, vars]

    SiteRequest:
      type: object
      properties:
        name:
          type: string
        vars:
          type: object
          additionalProperties:
            type: string
          description: Flat object of string values
      required: [name, vars]

    ConfigVersion:
      type: object
      properties:
        version:
          type: integer
        text:
          type: string
        note:
          type: string
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
      required: [version, text, note, created_at]

    CreateConfigVersionRequest:
      type: object
      properties:
        text:
          type: string
          description: Rendered in `uci export` format
        note:
          type: string
      required: [text, note]

    DiffOp:
      type: object
      properties:
        op:
          type: string
          enum: ["=", "+", "-"]
        text:
          type: string
      required: [op, text]

    RenderedConfig:
      type: object
      properties:
        text:
          type: string
          description: >
            Rendered `uci export` text with device/site variables filled
            in and secret values masked as "******".
        hash:
          type: string
          description: Lower-case hex SHA-256 of the rendered text
      required: [text, hash]

    Health:
      type: string
      description: >
        Computed from live state, never stored: offline when the device is
        not online, critical at 80 °C or 90 % RAM, warning at 72 °C, 80 %
        RAM or under 8 MB free in /tmp, healthy otherwise.
      enum: [healthy, warning, critical, offline]

    HWInterface:
      type: object
      properties:
        type:
          type: string
          example: mac
        identifier:
          type: string
          example: "AA:BB:CC:DD:EE:FF"
      required: [type, identifier]

    LastMetrics:
      type: object
      description: >
        The newest telemetry sample the device reported. A null value is
        one the gateway did not report.
      properties:
        time:
          type: string
          format: date-time
        cpu_pct:
          type: number
          nullable: true
        mem_pct:
          type: number
          nullable: true
        temp_c:
          type: number
          nullable: true
        tmp_free_kb:
          type: integer
          nullable: true
        signal_dbm:
          type: number
          nullable: true
        rx_bytes:
          type: integer
          nullable: true
        tx_bytes:
          type: integer
          nullable: true
      required: [time]

    Device:
      type: object
      properties:
        sn:
          type: string
        model_id:
          type: string
        model_name:
          type: string
        site_id:
          type: string
          format: uuid
          nullable: true
          description: Null while the device is not assigned to a site
        site_name:
          type: string
        lifecycle:
          type: string
          enum: [active, decommissioned, bricked]
        hw_rev:
          type: string
        online:
          type: boolean
        last_seen:
          type: string
          format: date-time
          nullable: true
        fw_version:
          type: string
        cfg_version:
          type: integer
          nullable: true
          description: Config version the device reported; null until it reports one
        cfg_hash:
          type: string
          description: Hash of the config the device reported running
        target_cfg_version:
          type: integer
          nullable: true
          description: >
            Config version the device's model targets; null when nothing
            has been pushed to that model yet
        drift:
          type: boolean
          description: Target config version differs from the reported one
        health:
          $ref: "#/components/schemas/Health"
        package_drift:
          type: string
          enum: [ok, drift, unknown]
          description: >
            Reported packages against the manifest of the firmware the
            device runs; unknown when no manifest is recorded for it
      required: [sn, model_id, model_name, site_name, lifecycle, online, drift, health, package_drift]

    DeviceList:
      type: object
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/Device"
        next_cursor:
          type: string
          description: >
            Pass as the cursor of the next request; absent on the last
            page
      required: [devices]

    DeviceDetail:
      allOf:
        - $ref: "#/components/schemas/Device"
        - type: object
          properties:
            created_at:
              type: string
              format: date-time
            soc:
              type: string
              nullable: true
              description: >
                SoC of the device's model; null when the model's hardware
                has not been recorded. Detail only: the device list does
                not carry it
            ram_mb:
              type: integer
              nullable: true
              description: >
                RAM of the device's model, in MB; null when unrecorded.
                Detail only
            flash_mb:
              type: integer
              nullable: true
              description: >
                Flash of the device's model, in MB; null when unrecorded.
                Detail only
            interfaces:
              type: array
              items:
                $ref: "#/components/schemas/HWInterface"
            last_metrics:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/LastMetrics"
            packages:
              type: array
              items:
                $ref: "#/components/schemas/PackageStatus"
          required: [created_at, interfaces, packages]

    PackageStatus:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
          description: The version the device reported
        expected:
          type: string
          description: >
            The version the device's firmware installs; empty when its
            manifest does not list the package or is unknown
        status:
          type: string
          enum: [ok, drift, not_in_manifest, unknown]
      required: [name, version, expected, status]

    FirmwareManifest:
      type: object
      properties:
        model_id:
          type: string
        fw_version:
          type: string
        packages:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              version:
                type: string
            required: [name, version]
      required: [model_id, fw_version, packages]

    FirmwareManifestCreated:
      type: object
      properties:
        model_id:
          type: string
        fw_version:
          type: string
        packages:
          type: integer
          description: Number of packages recorded
      required: [model_id, fw_version, packages]

    FleetPackages:
      type: object
      properties:
        model_id:
          type: string
        packages:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              expected:
                type: array
                description: What each firmware version the fleet runs installs
                items:
                  type: object
                  properties:
                    fw_version:
                      type: string
                    version:
                      type: string
                  required: [fw_version, version]
              installed:
                type: array
                items:
                  type: object
                  properties:
                    fw_version:
                      type: string
                    version:
                      type: string
                    devices:
                      type: integer
                    status:
                      type: string
                      enum: [ok, drift, not_in_manifest, unknown]
                  required: [fw_version, version, devices, status]
            required: [name, expected, installed]
      required: [model_id, packages]

    DevicePatch:
      type: object
      description: >
        At least one field. An omitted field keeps its current value; an
        explicit null site_id unassigns the device.
      properties:
        site_id:
          type: string
          format: uuid
          nullable: true
        lifecycle:
          type: string
          enum: [active, decommissioned, bricked]

    Overview:
      type: object
      properties:
        devices:
          type: integer
          description: Devices in the inventory
        health:
          $ref: "#/components/schemas/OverviewHealth"
        models:
          type: array
          items:
            $ref: "#/components/schemas/OverviewModel"
        active_rollouts:
          type: integer
          description: Rollouts not completed and not aborted; 0 until rollouts land
        open_alerts:
          type: integer
          description: Alerts not resolved; 0 until the alert evaluator lands
      required: [devices, health, models, active_rollouts, open_alerts]

    OverviewHealth:
      type: object
      description: Devices per health status; all four are always present.
      properties:
        healthy:
          type: integer
        warning:
          type: integer
        critical:
          type: integer
        offline:
          type: integer
      required: [healthy, warning, critical, offline]

    OverviewModel:
      type: object
      properties:
        model_id:
          type: string
        model_name:
          type: string
        devices:
          type: integer
        firmware:
          type: array
          items:
            $ref: "#/components/schemas/FirmwareCount"
      required: [model_id, model_name, devices, firmware]

    FirmwareCount:
      type: object
      properties:
        fw_version:
          type: string
          description: >
            The firmware the devices report; empty for a device that has not
            reported State yet
        devices:
          type: integer
      required: [fw_version, devices]

    MetricsSeries:
      type: object
      properties:
        sn:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        step:
          type: integer
          description: >
            Bucket size in seconds the series is served at: the requested
            step, or a coarser one when the range would otherwise exceed
            2,000 points
        points:
          type: array
          items:
            $ref: "#/components/schemas/MetricsPoint"
      required: [sn, from, to, step, points]

    MetricsPoint:
      type: object
      description: >
        One bucket: the mean of the samples in it. signal_dbm is null when no
        sample in the bucket reported one, which is not a reading of 0.
      properties:
        time:
          type: string
          format: date-time
          description: The bucket's start
        cpu_pct:
          type: number
        mem_pct:
          type: number
        temp_c:
          type: number
        tmp_free_kb:
          type: number
        signal_dbm:
          type: number
          nullable: true
        rx_bytes:
          type: number
        tx_bytes:
          type: number
      required: [time, cpu_pct, mem_pct, temp_c, tmp_free_kb, signal_dbm, rx_bytes, tx_bytes]

    DeviceHistory:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/HistoryEntry"
        next_cursor:
          type: string
          description: >
            Pass as the cursor of the next request; absent on the last page
      required: [entries]

    HistoryEntry:
      type: object
      description: >
        One line of the feed: a device event or a job. state, progress and
        error_code belong to a job and are null for an event.
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [event, job]
        type:
          type: string
          description: The event's or job's type tag
        state:
          type: string
          nullable: true
          description: Job state; null for an event
        progress:
          type: integer
          nullable: true
        error_code:
          type: integer
          nullable: true
        detail:
          nullable: true
          description: >
            A JSON value: an event's detail object, or a job's readable
            detail text as a JSON string
        created_at:
          type: string
          format: date-time
      required: [id, kind, type, state, progress, error_code, detail, created_at]

  responses:
    BadRequest:
      description: Malformed request body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, invalid or expired credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflicts with existing state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PreconditionFailed:
      description: A precondition (e.g. optimistic concurrency check) failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: Semantically invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
