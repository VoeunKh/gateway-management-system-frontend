# Draft endpoints the console needs before the backend publishes them.
#
# These are the proposals from docs/api-requests.md, written as OpenAPI so the console's
# types stay generated (npm run gen:api writes src/api/proposed.gen.ts). When the backend
# adds an endpoint to api/openapi.yaml, delete it here; the console keeps working because
# Schemas in src/api/endpoints.ts reads both files under the same names.
openapi: 3.0.3
info:
  title: gwfleet console draft API
  version: '0.1.0'
servers:
  - url: /api/v1
security:
  - bearerAuth: []

paths:
  /rollouts:
    get:
      tags: [rollouts]
      summary: Rollouts, newest first, without wave devices
      parameters:
        - name: state
          in: query
          description: active = running, soaking or paused; finished = completed or aborted
          schema:
            type: string
            enum: [active, finished]
        - name: sn
          in: query
          description: >
            Only rollouts that include this gateway; each wave then lists just that
            gateway, so the device page can show its own progress
          schema:
            type: string
      responses:
        '200':
          description: The rollouts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rollout'
        '401':
          $ref: './openapi.yaml#/components/responses/Unauthorized'

  /alerts:
    get:
      tags: [alerts]
      summary: Alerts, newest first
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum: [open, resolved]
        - name: limit
          in: query
          description: Default 50, maximum 200
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alert'
        '401':
          $ref: './openapi.yaml#/components/responses/Unauthorized'

  /devices/{sn}/actions:
    post:
      tags: [jobs]
      summary: Run a remote action on a gateway (admin)
      parameters:
        - name: sn
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '201':
          description: The job that tracks the action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: './openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: './openapi.yaml#/components/responses/NotFound'
        '409':
          description: action_pending (one of this type is already pending) or device_offline
          content:
            application/json:
              schema:
                $ref: './openapi.yaml#/components/schemas/Error'

  /jobs/{id}:
    get:
      tags: [jobs]
      summary: A job, polled every 3 s until its state is final
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: The job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: './openapi.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './openapi.yaml#/components/responses/NotFound'

  /jobs/{id}/cancel:
    post:
      tags: [jobs]
      summary: Cancel a job that has not started (admin)
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: The cancelled job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '403':
          $ref: './openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: './openapi.yaml#/components/responses/NotFound'
        '409':
          $ref: './openapi.yaml#/components/responses/Conflict'

  /jobs/{id}/logs:
    get:
      tags: [jobs]
      summary: Download link for the archive a successful logs job uploaded
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: A short-lived /dl/{token} link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobLogs'
        '404':
          $ref: './openapi.yaml#/components/responses/NotFound'
        '409':
          description: The job did not succeed, or is not a logs job
          content:
            application/json:
              schema:
                $ref: './openapi.yaml#/components/schemas/Error'

  /alerts/{id}/ack:
    post:
      tags: [alerts]
      summary: Acknowledge an open alert (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The acknowledged alert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '401':
          $ref: './openapi.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './openapi.yaml#/components/responses/Forbidden'
        '404':
          $ref: './openapi.yaml#/components/responses/NotFound'
        '409':
          $ref: './openapi.yaml#/components/responses/Conflict'

components:
  parameters:
    JobId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    DeviceExtras:
      type: object
      description: >
        Fields the device page shows that DeviceDetail does not carry yet; merged into
        the DeviceDetail response.
      properties:
        os:
          type: string
          example: OpenWrt 23.05.4
        uptime_s:
          type: integer
          nullable: true
          description: Seconds since boot; null while offline
        interfaces:
          type: array
          items:
            $ref: '#/components/schemas/InterfaceStatus'

    InterfaceStatus:
      type: object
      properties:
        type:
          type: string
        identifier:
          type: string
        name:
          type: string
          example: wwan0
        link_up:
          type: boolean
      required: [type, identifier]

    ActionRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/JobType'
      required: [type]

    JobType:
      type: string
      enum: [reboot, logs, ping]

    JobState:
      type: string
      enum: [pending, running, succeeded, failed, timed_out, cancelled]

    Job:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/JobType'
        sn:
          type: string
        state:
          $ref: '#/components/schemas/JobState'
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
          description: Null until the state is final
        progress:
          type: integer
          nullable: true
          description: 0..100, for the logs upload
        detail:
          type: string
          nullable: true
          description: 'Ping: "0% loss, avg 42 ms"'
        error:
          nullable: true
          description: Set when the job failed or timed out
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required: [code, message]
      required: [id, type, sn, state, created_at, finished_at, progress, detail, error]

    JobLogs:
      type: object
      properties:
        url:
          type: string
        expires_at:
          type: string
          format: date-time
      required: [url, expires_at]

    RolloutState:
      type: string
      enum: [running, soaking, paused, completed, aborted]

    RolloutDeviceState:
      type: string
      enum:
        [waiting, downloading, installing, updated, rolled_back, needs_recovery, skipped, deferred]

    RolloutCounters:
      type: object
      description: Gateways in the rollout by state; they add up to the rollout's size
      properties:
        updated:
          type: integer
        in_progress:
          type: integer
        rolled_back:
          type: integer
        needs_recovery:
          type: integer
        skipped:
          type: integer
        deferred:
          type: integer
        waiting:
          type: integer
      required: [updated, in_progress, rolled_back, needs_recovery, skipped, deferred, waiting]

    RolloutWave:
      type: object
      properties:
        percent:
          type: integer
          description: Share of the model's gateways updated once this wave finishes
        devices:
          type: array
          description: Present on GET /rollouts/{id} only
          items:
            type: object
            properties:
              sn:
                type: string
              state:
                $ref: '#/components/schemas/RolloutDeviceState'
              progress:
                type: integer
                nullable: true
                description: Download progress 0..100 while state is downloading
            required: [sn, state]
      required: [percent]

    Rollout:
      type: object
      properties:
        id:
          type: string
          example: R-014
        model_id:
          type: string
        fw_version:
          type: string
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          description: Name of the user who started it
        state:
          $ref: '#/components/schemas/RolloutState'
        pause_reason:
          type: string
          nullable: true
          description: Why the rollout paused itself; null when paused by a person or running
        counters:
          $ref: '#/components/schemas/RolloutCounters'
        waves:
          type: array
          items:
            $ref: '#/components/schemas/RolloutWave'
      required: [id, model_id, fw_version, created_at, created_by, state, counters, waves]

    AlertSeverity:
      type: string
      enum: [info, warning, critical]

    Alert:
      type: object
      properties:
        id:
          type: string
        sn:
          type: string
        rule:
          type: string
          example: temp_high
        severity:
          $ref: '#/components/schemas/AlertSeverity'
        message:
          type: string
          example: Temperature 81 °C
        opened_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
        acked_by:
          type: string
          nullable: true
          description: Name of the admin who acknowledged it
        acked_at:
          type: string
          format: date-time
          nullable: true
      required: [id, sn, rule, severity, message, opened_at, resolved_at, acked_by, acked_at]
