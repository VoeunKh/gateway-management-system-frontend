name: e2e

# Playwright flows at desktop and phone width against the production build and the MSW
# mock API. Nightly rather than on every merge, so the merge pipeline stays fast.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --repeat-each=2
      - name: Keep the report and traces when a flow fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
