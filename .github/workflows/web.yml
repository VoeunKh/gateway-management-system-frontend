name: web

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generated API types match api/openapi.yaml and api/proposed.yaml
        run: npm run gen:api && git diff --exit-code -- src/api/types.gen.ts src/api/proposed.gen.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image and start it
        run: make prod-up
      - name: Smoke test
        run: make smoke
      - name: Stop
        if: always()
        run: make prod-down
